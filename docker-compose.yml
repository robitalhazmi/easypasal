services:
  collector:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    image: easypasal-collector:latest
    container_name: easypasal-collector
    ports:
      - "8080:8080"
    environment:
      - EASYPASAL_COLLECTOR_HOST=0.0.0.0
      - EASYPASAL_COLLECTOR_PORT=8080
      - EASYPASAL_COLLECTOR_DB_PATH=/data/collector.db
      - EASYPASAL_COLLECTOR_TOKEN=easypasal-vps-secret-token-v1
    volumes:
      - collector_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: easypasal-app:latest
    container_name: easypasal-app
    command: ["python", "-m", "easypasal.api.app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - EASYPASAL_ENV=production
      - EASYPASAL_LLM_PROVIDER=${EASYPASAL_LLM_PROVIDER:-mock}
      - EASYPASAL_COLLECTOR_URL=http://collector:8080
      - EASYPASAL_COLLECTOR_TOKEN=easypasal-vps-secret-token-v1
      - LOG_COLLECTOR_URL=http://collector:8080
      - LOG_COLLECTOR_TOKEN=easypasal-vps-secret-token-v1
    volumes:
      - model_cache:/home/user/.cache
    depends_on:
      collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: easypasal-app:latest
    container_name: easypasal-ui
    command: ["python", "-m", "easypasal.ui.app", "--host", "0.0.0.0", "--port", "7860"]
    ports:
      - "7860:7860"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - EASYPASAL_LLM_PROVIDER=${EASYPASAL_LLM_PROVIDER:-mock}
      - EASYPASAL_COLLECTOR_URL=http://collector:8080
      - EASYPASAL_COLLECTOR_TOKEN=easypasal-vps-secret-token-v1
      - LOG_COLLECTOR_URL=http://collector:8080
      - LOG_COLLECTOR_TOKEN=easypasal-vps-secret-token-v1
    volumes:
      - model_cache:/home/user/.cache
    depends_on:
      app:
        condition: service_healthy
      collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

volumes:
  collector_data:
  model_cache:
