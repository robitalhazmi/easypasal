# EasyPasal v0.1 Production Baseline Configuration
# Frozen variant following Phase 4 Core Experiments (E1-E4).
# Reference: docs/decision-log.md

version: "0.1"
variant_id: "baseline_v0.1"
description: "EasyPasal v0.1 Frozen Production Baseline (Structure-Aware Chunks + Multilingual-E5-Large + Pure Dense + Llama-3.2-1B CPU / Qwen2.5-3B GPU)"
created_at: "2026-10-15"

corpus:
  total_documents: 21
  manifest_path: "data/corpus_manifest.json"
  raw_dir: "data/raw"
  parsed_dir: "data/parsed"
  themes:
    - "General Financial Regulation"
    - "Capital Markets"
    - "IT & Cyber Risk"
    - "Consumer Protection"
    - "AML / CFT"

chunking:
  strategy: "structure_aware"
  include_breadcrumbs: true
  target_chunk_size: 512
  overlap: 64
  chunks_path: "data/chunks/structure_aware_chunks.json"

embeddings:
  model_name: "intfloat/multilingual-e5-large"
  dimension: 1024
  backend: "fastembed"
  max_length: 512
  prefix_query: "query: "
  prefix_passage: "passage: "
  batch_size: 64

retrieval:
  mode: "dense"
  top_k: 5
  vector_store: "qdrant"
  index_dir: "data/index"
  collection_name: "easypasal_structure_aware_multilingual_e5_large"
  distance: "Cosine"
  score_threshold: null
  reranker: null

generator:
  cpu_default:
    provider: "llamacpp"
    repo_id: "bartowski/Llama-3.2-1B-Instruct-GGUF"
    filename: "Llama-3.2-1B-Instruct-Q4_K_M.gguf"
    quantization: "Q4_K_M"
    n_ctx: 8192
    n_threads: 4
    max_tokens: 160
    temperature: 0.1
    stop_tokens:
      - "<|eot_id|>"
      - "<|im_end|>"
      - "<|end_of_text|>"
      - "<|endoftext|>"
      - "</answer>"
      - "\n\n\n"
  gpu_target:
    provider: "vllm"
    repo_id: "Qwen/Qwen2.5-3B-Instruct-GGUF"
    filename: "qwen2.5-3b-instruct-q4_k_m.gguf"
    n_ctx: 8192
    max_tokens: 160
    temperature: 0.1

guardrails:
  verify_citations: true
  strict_grounding: false
  status_filter: "berlaku"
  default_language: "id"
